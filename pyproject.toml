[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qkhosts"
version = "0.1.0.dev0"
description = "Quantum-kernel learning of CCE spin-coherence for spin-qubit host screening"
authors = [{name = "Kian Farahmand", email = "kianfarahmand@thefiis.com"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "pandas>=2.0", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
cce = ["pycce", "pymatgen", "mp-api", "ase"]
qml = ["pennylane>=0.35"]
gnn = ["torch"]
plot = ["matplotlib"]
io = ["pyarrow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
