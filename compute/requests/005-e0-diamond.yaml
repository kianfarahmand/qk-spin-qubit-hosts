# LAUNCHED S010 (2026-10-29) with Kian's OK, one push after 004. Results: results/cce/005-e0-diamond/ or `python scripts/fetch_cce_results.py 005-e0-diamond`.
#
# Purpose: E0 diamond benchmark. Separate request because Kanai Fig. 2A puts B along [111] for diamond,
# and protocol fields are per request, not per material.
# Target (Kanai Table S1, SI p. 20): 0.97(12) ms. Toriyama 2025 (spin-1): 1.08 ms.
# Experimental anchors: single NV 0.65 ms (A001), ensemble > 0.6 ms (A002).
#
# b_direction [1,1,1] is Cartesian, so it is [111] only if the CIF is the CONVENTIONAL cubic cell
# (a along x). S010 (T-064): mp-66 (Kanai set_crystal_v2.m l.47) fetched keylessly from MP OPTIMADE and converted
# primitive -> conventional cubic (8 sites) by qkhosts.data.optimade.conventional_cubic; provenance in
# compute/structures/e0/SOURCES.json. Diamond has 1 inequivalent site.
id: 005-e0-diamond
mode: cce
nshards: 1
protocol:
  central_spin: 0.5
  b_field_T: 5.0
  b_direction: [1.0, 1.0, 1.0]   # normalised by pycce_runner._coherence
  order: 2
  ladder: [[50.0, 15.0], [65.0, 20.0], [80.0, 25.0]]
  n_conf: 20
  n_sites_max: 3
  as_delay: false
  seed: 0
materials:
  - {id: diamond, cif: compute/structures/e0/C_diamond_conventional.cif}
